name: 메타 전환 월별 광고비 일회성 조회 (읽기 전용)

on:
  workflow_dispatch:
    inputs:
      since:
        description: '시작일 (YYYY-MM-DD)'
        required: true
      until:
        description: '종료일 (YYYY-MM-DD)'
        required: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: 메타 광고단위 월별 수집
        env:
          META_ACCESS_TOKEN: "${{ secrets.META_ACCESS_TOKEN }}"
          META_AD_ACCOUNT_ID: "${{ secrets.META_AD_ACCOUNT_ID }}"
          SINCE: "${{ github.event.inputs.since }}"
          UNTIL: "${{ github.event.inputs.until }}"
        run: python scripts/meta_monthly_adlevel.py
      - uses: actions/upload-artifact@v4
        with:
          name: meta_monthly_adlevel
          path: out/meta_monthly_adlevel.csv
          retention-days: 14
